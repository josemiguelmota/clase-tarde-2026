<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Título de mi Página</title>
    <style>
        /* Estética minimalista, editorial y monocromática al estilo Stradivarius */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 12px;
            color: #000000;
        }

        p {
            font-size: 0.85rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #555555;
            max-width: 480px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        /* Botón opcional con el diseño característico de la marca */
        .btn-stradivarius {
            display: inline-block;
            padding: 14px 36px;
            background-color: #000000;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 1px solid #000000;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .btn-stradivarius:hover {
            background-color: #ffffff;
            color: #000000;
        }
    </style>
</head>
<body>

    <h1>¡Hola, mundo!</h1>
    <p>Este es el contenido visible de la página.</p>
    <a href="#" class="btn-stradivarius">Descubrir</a>

</body>
</html>
